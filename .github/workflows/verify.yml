name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  TURBO_FORCE: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @portfolio/web exec playwright install --with-deps --only-shell chromium
      - run: pnpm verify
        env:
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ github.event_name == 'push' && vars.CF_ANALYTICS_TOKEN || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/web/out
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy
    needs: verify
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'production' || format('preview-pr-{0}', github.event.pull_request.number) }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @portfolio/web
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: apps/web/out
      - id: deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            pnpm exec wrangler deploy
            url=$(jq -r 'select(.type == "deploy") | .targets[0]' "$WRANGLER_OUTPUT_FILE_PATH")
          else
            pnpm exec wrangler versions upload --preview-alias "pr-$PR_NUMBER"
            url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url' "$WRANGLER_OUTPUT_FILE_PATH")
          fi
          case "$url" in
            https://*) echo "url=$url" >> "$GITHUB_OUTPUT" ;;
            *) echo "No URL in Wrangler's output: $url"; exit 1 ;;
          esac
